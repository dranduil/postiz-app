services:
  postiz:
    image: "${POSTIZ_IMAGE:-ghcr.io/gitroomhq/postiz-app:latest}"
    pull_policy: always
    restart: always

    environment:
      # === Required Settings
      MAIN_URL: "${MAIN_URL:?Set MAIN_URL in Dokploy}"
      FRONTEND_URL: "${FRONTEND_URL:?Set FRONTEND_URL in Dokploy}"
      NEXT_PUBLIC_BACKEND_URL: "${NEXT_PUBLIC_BACKEND_URL:?Set NEXT_PUBLIC_BACKEND_URL in Dokploy}"

      # Replace with a strong random secret
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in Dokploy}"

      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL to the shared PostgreSQL URL in Dokploy}"
      REDIS_URL: "${REDIS_URL:?Set REDIS_URL to the shared Redis URL in Dokploy}"

      BACKEND_INTERNAL_URL: "${BACKEND_INTERNAL_URL:-http://localhost:3000}"
      TEMPORAL_ADDRESS: "${TEMPORAL_ADDRESS:-temporal:7233}"

      IS_GENERAL: "${IS_GENERAL:-true}"
      DISABLE_REGISTRATION: "${DISABLE_REGISTRATION:-false}"
      RUN_CRON: "${RUN_CRON:-true}"

      # === Storage Settings
      STORAGE_PROVIDER: "${STORAGE_PROVIDER:-local}"
      UPLOAD_DIRECTORY: "${UPLOAD_DIRECTORY:-/uploads}"
      NEXT_PUBLIC_UPLOAD_DIRECTORY: "${NEXT_PUBLIC_UPLOAD_DIRECTORY:-/uploads}"
      NEXT_PUBLIC_UPLOAD_STATIC_DIRECTORY: "${NEXT_PUBLIC_UPLOAD_STATIC_DIRECTORY:-/uploads}"

      # === Cloudflare R2 Settings
      CLOUDFLARE_ACCOUNT_ID: "${CLOUDFLARE_ACCOUNT_ID:-}"
      CLOUDFLARE_ACCESS_KEY: "${CLOUDFLARE_ACCESS_KEY:-}"
      CLOUDFLARE_SECRET_ACCESS_KEY: "${CLOUDFLARE_SECRET_ACCESS_KEY:-}"
      CLOUDFLARE_BUCKETNAME: "${CLOUDFLARE_BUCKETNAME:-}"
      CLOUDFLARE_BUCKET_URL: "${CLOUDFLARE_BUCKET_URL:-}"
      CLOUDFLARE_REGION: "${CLOUDFLARE_REGION:-auto}"

      # === Social Media Providers
      X_URL: "${X_URL:-}"
      X_API_KEY: "${X_API_KEY:-}"
      X_API_SECRET: "${X_API_SECRET:-}"

      LINKEDIN_CLIENT_ID: "${LINKEDIN_CLIENT_ID:-}"
      LINKEDIN_CLIENT_SECRET: "${LINKEDIN_CLIENT_SECRET:-}"

      REDDIT_CLIENT_ID: "${REDDIT_CLIENT_ID:-}"
      REDDIT_CLIENT_SECRET: "${REDDIT_CLIENT_SECRET:-}"

      GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID:-}"
      GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET:-}"

      APPLE_CLIENT_ID: "${APPLE_CLIENT_ID:-}"
      APPLE_TEAM_ID: "${APPLE_TEAM_ID:-}"
      APPLE_KEY_ID: "${APPLE_KEY_ID:-}"
      APPLE_PRIVATE_KEY: "${APPLE_PRIVATE_KEY:-}"

      BEEHIIVE_API_KEY: "${BEEHIIVE_API_KEY:-}"
      BEEHIIVE_PUBLICATION_ID: "${BEEHIIVE_PUBLICATION_ID:-}"

      THREADS_APP_ID: "${THREADS_APP_ID:-}"
      THREADS_APP_SECRET: "${THREADS_APP_SECRET:-}"

      FACEBOOK_APP_ID: "${FACEBOOK_APP_ID:-}"
      FACEBOOK_APP_SECRET: "${FACEBOOK_APP_SECRET:-}"

      YOUTUBE_CLIENT_ID: "${YOUTUBE_CLIENT_ID:-}"
      YOUTUBE_CLIENT_SECRET: "${YOUTUBE_CLIENT_SECRET:-}"

      TIKTOK_CLIENT_ID: "${TIKTOK_CLIENT_ID:-}"
      TIKTOK_CLIENT_SECRET: "${TIKTOK_CLIENT_SECRET:-}"

      PINTEREST_CLIENT_ID: "${PINTEREST_CLIENT_ID:-}"
      PINTEREST_CLIENT_SECRET: "${PINTEREST_CLIENT_SECRET:-}"

      DRIBBBLE_CLIENT_ID: "${DRIBBBLE_CLIENT_ID:-}"
      DRIBBBLE_CLIENT_SECRET: "${DRIBBBLE_CLIENT_SECRET:-}"

      TUMBLR_CLIENT_ID: "${TUMBLR_CLIENT_ID:-}"
      TUMBLR_CLIENT_SECRET: "${TUMBLR_CLIENT_SECRET:-}"

      DISCORD_CLIENT_ID: "${DISCORD_CLIENT_ID:-}"
      DISCORD_CLIENT_SECRET: "${DISCORD_CLIENT_SECRET:-}"
      DISCORD_BOT_TOKEN_ID: "${DISCORD_BOT_TOKEN_ID:-}"

      SLACK_ID: "${SLACK_ID:-}"
      SLACK_SECRET: "${SLACK_SECRET:-}"
      SLACK_SIGNING_SECRET: "${SLACK_SIGNING_SECRET:-}"

      MASTODON_URL: "${MASTODON_URL:-https://mastodon.social}"
      MASTODON_CLIENT_ID: "${MASTODON_CLIENT_ID:-}"
      MASTODON_CLIENT_SECRET: "${MASTODON_CLIENT_SECRET:-}"

      # === OAuth / OIDC
      NEXT_PUBLIC_POSTIZ_OAUTH_DISPLAY_NAME: "${NEXT_PUBLIC_POSTIZ_OAUTH_DISPLAY_NAME:-}"
      NEXT_PUBLIC_POSTIZ_OAUTH_LOGO_URL: "${NEXT_PUBLIC_POSTIZ_OAUTH_LOGO_URL:-}"
      POSTIZ_GENERIC_OAUTH: "${POSTIZ_GENERIC_OAUTH:-false}"
      POSTIZ_OAUTH_URL: "${POSTIZ_OAUTH_URL:-}"
      POSTIZ_OAUTH_AUTH_URL: "${POSTIZ_OAUTH_AUTH_URL:-}"
      POSTIZ_OAUTH_TOKEN_URL: "${POSTIZ_OAUTH_TOKEN_URL:-}"
      POSTIZ_OAUTH_USERINFO_URL: "${POSTIZ_OAUTH_USERINFO_URL:-}"
      POSTIZ_OAUTH_CLIENT_ID: "${POSTIZ_OAUTH_CLIENT_ID:-}"
      POSTIZ_OAUTH_CLIENT_SECRET: "${POSTIZ_OAUTH_CLIENT_SECRET:-}"
      POSTIZ_OAUTH_SCOPE: "${POSTIZ_OAUTH_SCOPE:-openid profile email}"

      # === Email / Resend
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      EMAIL_FROM_ADDRESS: "${EMAIL_FROM_ADDRESS:-}"
      EMAIL_FROM_NAME: "${EMAIL_FROM_NAME:-}"

      # === MCP / Agent
      MCP_URL: "${MCP_URL:-}"
      AGENT_API_KEY: "${AGENT_API_KEY:-}"
      AGENT_MEDIA_SSO_KEY: "${AGENT_MEDIA_SSO_KEY:-}"

      # === AI
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"

      # === Misc
      NEXT_PUBLIC_DISCORD_SUPPORT: "${NEXT_PUBLIC_DISCORD_SUPPORT:-}"
      NEXT_PUBLIC_POLOTNO: "${NEXT_PUBLIC_POLOTNO:-}"
      API_LIMIT: "${API_LIMIT:-30}"

      # === Stripe
      FEE_AMOUNT: "${FEE_AMOUNT:-0.05}"
      STRIPE_PUBLISHABLE_KEY: "${STRIPE_PUBLISHABLE_KEY:-}"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
      STRIPE_SIGNING_KEY: "${STRIPE_SIGNING_KEY:-}"
      STRIPE_SIGNING_KEY_CONNECT: "${STRIPE_SIGNING_KEY_CONNECT:-}"

      # === Developer Settings
      NX_ADD_PLUGINS: "${NX_ADD_PLUGINS:-false}"

      # === Short Link Services
      # DUB_TOKEN: ''
      # DUB_API_ENDPOINT: 'https://api.dub.co'
      # DUB_SHORT_LINK_DOMAIN: 'dub.sh'

      # SHORT_IO_SECRET_KEY: ''

      # KUTT_API_KEY: ''
      # KUTT_API_ENDPOINT: 'https://kutt.it/api/v2'
      # KUTT_SHORT_LINK_DOMAIN: 'kutt.it'

      # LINK_DRIP_API_KEY: ''
      # LINK_DRIP_API_ENDPOINT: 'https://api.linkdrip.com/v1/'
      # LINK_DRIP_SHORT_LINK_DOMAIN: 'dripl.ink'

    volumes:
      - postiz-config:/config/
      - postiz-uploads:/uploads/

    expose:
      - '5000'

    networks:
      - postiz-network
      - temporal-network
      - dokploy-network

    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "const r=require('http').get('http://localhost:5000/',res=>process.exit(res.statusCode<500?0:1));r.on('error',()=>process.exit(1));r.setTimeout(4000,()=>{r.destroy();process.exit(1)})"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

    depends_on:
      temporal:
        condition: service_healthy


  # Optional debugging service.
  spotlight:
    profiles:
      - debug

    image: ghcr.io/getsentry/spotlight:latest
    restart: unless-stopped
    pull_policy: always

    expose:
      - '8969'

    networks:
      - postiz-network


  # ==========================================================
  # Temporal Stack
  # ==========================================================

  temporal-elasticsearch:
    image: elasticsearch:7.17.27
    restart: always

    environment:
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false

    expose:
      - '9200'

    networks:
      - temporal-network

    volumes:
      - temporal-elasticsearch-data:/usr/share/elasticsearch/data

    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -fsS "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s" || exit 1'
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s


  temporal-postgresql:
    image: postgres:16
    restart: always

    environment:
      POSTGRES_PASSWORD: 'temporal'
      POSTGRES_USER: 'temporal'

    expose:
      - '5432'

    networks:
      - temporal-network

    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U temporal'
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  temporal:
    image: temporalio/auto-setup:1.28.1
    restart: always

    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgresql
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
      - ENABLE_ES=true
      - ES_SEEDS=temporal-elasticsearch
      - ES_VERSION=v7
      - TEMPORAL_NAMESPACE=default

    expose:
      - '7233'

    networks:
      - temporal-network

    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig

    labels:
      kompose.volume.type: configMap

    depends_on:
      temporal-postgresql:
        condition: service_healthy

      temporal-elasticsearch:
        condition: service_healthy

    healthcheck:
      test:
        [
          'CMD-SHELL',
          'temporal operator cluster health --address 127.0.0.1:7233 | grep -q SERVING'
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s


  temporal-admin-tools:
    image: temporalio/admin-tools:1.28.1-tctl-1.18.4-cli-1.4.1
    restart: on-failure

    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CLI_ADDRESS=temporal:7233

    networks:
      - temporal-network

    stdin_open: true
    tty: true

    depends_on:
      temporal:
        condition: service_healthy


  temporal-ui:
    image: temporalio/ui:2.34.0
    restart: always

    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - "TEMPORAL_CORS_ORIGINS=${TEMPORAL_CORS_ORIGINS:-http://localhost:4200}"

    expose:
      - '8080'

    networks:
      - temporal-network

    healthcheck:
      test:
        [
          'CMD',
          'curl',
          '-f',
          'http://localhost:8080/healthz'
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

    depends_on:
      temporal:
        condition: service_healthy


volumes:
  postiz-config:
    external: false

  postiz-uploads:
    external: false

  temporal-postgres-data:
    external: false

  temporal-elasticsearch-data:
    external: false


networks:
  postiz-network:
    driver: bridge

  temporal-network:
    driver: bridge

  # Dokploy's Traefik and shared PostgreSQL/Redis containers must be on this network.
  dokploy-network:
    external: true
    name: "${DOKPLOY_NETWORK_NAME:-dokploy-network}"
